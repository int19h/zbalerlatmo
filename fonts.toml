# Fonts to build. Paths are relative to the repository root.
#
#   id           short name used on the command line
#   source       upstream OTF to build from
#   latin        Latin font the upstream design was derived from; it supplies
#                missing punctuation and the Latin fallback outlines. "self"
#                uses the upstream font's own Latin; "derive" builds the comma
#                and quote marks from the font's own semicolon and double quote
#   latin_axes   axis values for a variable Latin font (default wght = 400)
#   family/style names of the built font
#   license      "OFL-1.1", "Apache-2.0" or "GPL-2.0", written into the font;
#                "other" with license_text for anything else (see
#                fonts/LICENSES.md)
#   reference    the tests check exact glyph names on these fonts (Crisa);
#                every other font is checked against its upstream font
#   pua_feature  upstream feature holding the Zbalermorna lookups ("liga" in
#                the upstream fonts that have them); it is folded
#                into rlig, which ligature switches leave on. Leave it out
#                when the upstream font has no Zbalermorna lookups to fold

[[font]]
id = "crisa-regular"
source = "zbalermorna/fonts/crisa-regular.otf"
latin = "vendor/lato/Lato-Regular.ttf"
family = "Crisa Latmo"
style = "Regular"
pua_feature = "liga"
license = "OFL-1.1"
version = "0.1"
reference = true

