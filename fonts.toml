# Fonts to build. Paths are relative to the repository root.
#
#   id           short name used on the command line
#   source       upstream OTF to build from
#   latin        Latin font the upstream design was derived from; it supplies
#                missing punctuation and the Latin fallback outlines
#   family/style names of the built font
#   pua_feature  upstream feature holding the Zbalermorna lookups ("liga" in
#                most upstream fonts, "calt" in fira-code-zlm); it is folded
#                into rlig, which ligature switches leave on

[[font]]
id = "crisa-regular"
source = "zbalermorna/fonts/crisa-regular.otf"
latin = "vendor/lato/Lato-Regular.ttf"
family = "Crisa Latmo"
style = "Regular"
pua_feature = "liga"
version = "0.1"

[[font]]
id = "crisa-light"
source = "zbalermorna/fonts/crisa-light.otf"
latin = "vendor/lato/Lato-Light.ttf"
family = "Crisa Latmo"
style = "Light"
pua_feature = "liga"
version = "0.1"
